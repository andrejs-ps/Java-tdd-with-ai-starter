exchange.port=7070

# Internal flakiness: a random chance of a slow response. Not part of the API, not documented for clients.
# Set to false for deterministic end-to-end tests.
exchange.faults.enabled=true
exchange.faults.slow-chance=0.0
exchange.faults.slow-delay-ms=5000

# Price fluctuation: how far a price may move away from its base price on each call.
# 0.02 means up to 2% up or down, so e.g. 226.79 <= AAPL (base 231.42) <= 236.05
# 0.0 means price is static.
exchange.price-fluctuation=0.02
