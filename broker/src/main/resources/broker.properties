broker.port=7080

# The exchange Maven Module, and how long the broker waits for it
exchange.url=http://localhost:7070
exchange.timeout-ms=2000

# What the broker charges for every filled order, in USD. A buy pays it on top of the price.
# A sell has it taken out of the proceeds, or no fee at all if the proceeds are smaller than the fee.
# 0 means no fee; a negative number is treated as 0.
broker.fee-usd=1.00

db.url=jdbc:h2:file:./data/broker;AUTO_SERVER=FALSE
